{% if slots %}
    <div class="grid grid-cols-3 gap-3 overflow-y-auto max-h-[300px] p-1">
        {% for slot in slots %}
            {% if slot.available %}
            <button type="button"
                @click="selectTime('{{ slot.time }}')"
                class="py-3 px-2 rounded-xl border border-gray-200 transition-all hover:border-dustyrose hover:bg-rose-50 hover:text-dustyrosedark hover:shadow-md focus:outline-none"
                :class="{'border-dustyrose bg-rose-50 text-dustyrosedark ring-2 ring-rose-200': selectedTime === '{{ slot.time }}', 'text-gray-900': selectedTime !== '{{ slot.time }}'}">
                <span class="font-bold">{{ slot.time }}</span>
            </button>
            {% else %}
            <!-- Turno ocupado / No disponible -->
            <button type="button" disabled
                class="py-3 px-2 rounded-xl border border-gray-100 bg-gray-50 text-gray-400 cursor-not-allowed flex items-center justify-center flex-col relative opactiy-70">
                <span class="font-bold line-through">{{ slot.time }}</span>
                <span class="text-[10px] absolute bottom-0 -mb-1">Reservado</span>
            </button>
            {% endif %}
        {% endfor %}
    </div>
{% else %}
    <div class="flex flex-col items-center justify-center p-8 bg-gray-50 rounded-xl border border-gray-200 text-center">
        <span class="text-3xl mb-2">😔</span>
        <h3 class="font-bold text-gray-600">No hay horarios</h3>
        <p class="text-sm text-gray-500 mt-1">Ese día ya está completo o pasaron todos los horarios disponibles. Por favor, elige otra fecha.</p>
    </div>
{% endif %}
